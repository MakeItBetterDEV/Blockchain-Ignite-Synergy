syntax = "proto3";
package projectbit.projectbit.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "projectbit/projectbit/v1/params.proto";

option go_package = "projectBit/x/projectbit/types";

// GenesisState defines the projectbit module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
