syntax = "proto3";
package projectbit.projectbit.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "projectBit/x/projectbit/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "projectbit/x/projectbit/Params";
  option (gogoproto.equal) = true;
}
